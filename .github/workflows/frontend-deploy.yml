name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'hospital-his-frontend/**'
      - '.github/workflows/frontend-deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd hospital-his-frontend
          npm install

      - name: Build
        run: |
          cd hospital-his-frontend
          npm run build
        env:
          # Note: If you have environment variables, add them to GitHub Secrets
          # and map them here. Example:
          # VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          CI: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          cd hospital-his-frontend
          # Sync dist folder to S3 bucket
          aws s3 sync dist/ s3://his-frontend --delete
